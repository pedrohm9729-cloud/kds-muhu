<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MUHU KDS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 108 108'%3E%3Crect width='108' height='108' rx='22' fill='%2314120F'/%3E%3Cg fill='%23F3EEE6'%3E%3Cpath d='M21.75,56V34h4l2.75,8l2.75,-8h4v22h-4v-12l-2.75,7l-2.75,-7v12z'/%3E%3Cpath d='M38.75,34h4v15.25a2.75,2.75 0 0 0 5.5,0v-15.25h4v15.25a6.75,6.75 0 0 1 -13.5,0z'/%3E%3Cpath d='M55.75,34h4v9h5.5v-9h4v22h-4v-9h-5.5v9h-4z'/%3E%3Cpath d='M72.75,34h4v15.25a2.75,2.75 0 0 0 5.5,0v-15.25h4v15.25a6.75,6.75 0 0 1 -13.5,0z'/%3E%3C/g%3E%3Crect x='36' y='62' width='36' height='14' rx='7' fill='%23C08A54'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{--bg:#14120f;--rail:#1c1915;--ticket:#25211c;--linea:#38322a;--txt:#f3eee6;--sub:#a59c8e;
--verde:#3fb36b;--ambar:#e9a13b;--rojo:#e2504a;--azul:#4a8fe0;--resalta:#f6cf62;--cafe:#c08a54;
--f-disp:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;--f-txt:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
--f-num:"JetBrains Mono",ui-monospace,Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--txt);margin:0}
body{font:16px/1.35 var(--f-txt);min-height:100%}
button{font:inherit;color:inherit;border:0;cursor:pointer;border-radius:10px}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--resalta);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:0;z-index:5;background:var(--rail);border-bottom:1px solid var(--linea)}
.barra{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding-block:10px}
.marca{font:800 26px/1 var(--f-disp);letter-spacing:.5px;text-transform:uppercase;margin-right:6px;display:flex;align-items:center;gap:8px}
.logo{display:flex;align-items:center;gap:7px}.logo b{font:800 28px/1 var(--f-disp);letter-spacing:1.5px;color:var(--txt)}
.logo i{font:800 12px/1 var(--f-disp);font-style:normal;letter-spacing:1.5px;background:var(--cafe);color:#14120f;padding:4px 8px 3px;border-radius:99px}
#conexion{width:10px;height:10px;border-radius:50%;background:var(--rojo)}#conexion.ok{background:var(--verde)}
nav{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:12px}
nav a{font:700 17px var(--f-disp);text-transform:uppercase;letter-spacing:.6px;color:var(--sub);text-decoration:none;padding:6px 14px;border-radius:9px}
nav a.on{background:var(--ticket);color:var(--txt)}
.esp{flex:1}
.chip{font:500 13px var(--f-txt);color:var(--sub);background:var(--bg);border:1px solid var(--linea);border-radius:20px;padding:4px 11px;white-space:nowrap}
.chip b{font-family:var(--f-num);color:var(--txt)}
.chip.enc{color:var(--txt);border-color:var(--cafe);cursor:pointer}.chip.enc b{color:var(--resalta)}
.b{background:var(--ticket);border:1px solid var(--linea);padding:7px 12px;font-weight:600;font-size:14px;color:var(--txt);text-decoration:none}
.b:hover{border-color:var(--sub)}
main{padding-block:16px 40px}
.tablero{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));align-items:start}
.sec{grid-column:1/-1;font:800 16px var(--f-disp);letter-spacing:1.4px;text-transform:uppercase;color:var(--sub);margin:4px 0 -4px}
.vacio{grid-column:1/-1;text-align:center;color:var(--sub);padding:56px 0;font-size:18px}
.card{background:var(--ticket);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;border:2px solid transparent;min-width:0}
.card .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:9px 14px;color:#10130f}
.card.v .top{background:var(--verde)}.card.a .top{background:var(--ambar)}.card.r .top{background:var(--rojo);color:#fff}
.card.r{border-color:var(--rojo)}.card.lista .top{background:var(--azul);color:#fff}
.card.despachada{opacity:.5}.caja .card.lista{border-color:var(--azul)}
.card.flash{animation:flash .9s 4}@keyframes flash{50%{box-shadow:0 0 0 5px var(--resalta)}}
.mesa{font:800 25px/1 var(--f-disp);text-transform:uppercase;letter-spacing:.3px;min-width:0}
.mesa small{font-weight:600;font-size:17px;opacity:.85}
.reloj{font:700 22px/1 var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.despachada .reloj{font-size:17px}
.titulo{margin:8px 12px 0;padding:6px 10px;border-radius:8px;background:color-mix(in srgb,var(--resalta) 16%,var(--ticket));color:var(--resalta);font-weight:700}
.meta{padding:7px 14px 2px;color:var(--sub);font-size:14px}.meta b{font-family:var(--f-num);font-weight:500}
ul{list-style:none;margin:0;padding:4px 6px 8px}
li{padding:8px;border-radius:8px}li+li{border-top:1px dashed var(--linea)}
li.tap{cursor:pointer}li.tap:hover{background:color-mix(in srgb,var(--txt) 5%,transparent)}
.p{font-size:19px;font-weight:700}.q{font-family:var(--f-num);color:var(--resalta);margin-right:6px}
.m{color:var(--sub);font-size:15px;padding-left:24px}
li.hecho .p,li.hecho .m{text-decoration:line-through;opacity:.4}
li.cancel{background:color-mix(in srgb,var(--rojo) 18%,var(--ticket))}
li.cancel .p,li.cancel .m{text-decoration:line-through;color:#ff9a95}
.tag{font:700 12px var(--f-txt);padding:2px 7px;border-radius:6px;margin-left:6px;vertical-align:2px;display:inline-block}
.tag.cambio{background:var(--resalta);color:#1a1410}.tag.nuevo{background:var(--azul);color:#fff}.tag.anul{background:var(--rojo);color:#fff}
.acc{padding:0 10px 12px;display:flex}
li.pal{border-left:6px solid var(--pc);background:color-mix(in srgb,var(--pc) 15%,var(--ticket))}li.pal .p{color:var(--pc)}
li.pal.cancel .p{color:#ff9a95}
.banda{font:800 24px/1 var(--f-disp);letter-spacing:2px;text-align:center;padding:9px 8px}
.banda.llevar{background:#f3eee6;color:#14120f}
.banda.rappi{background:repeating-linear-gradient(-45deg,#ff441f 0 14px,#d63516 14px 28px);color:#fff;text-shadow:0 1px 2px #0006}
.card.rappi{border:3px solid #ff441f!important}
.card.llevar .p{font-size:24px}.card.llevar .m{font-size:18px}.card.llevar .mesa{font-size:31px}
@media (min-width:640px){.card.llevar{grid-column:span 2}}
#palL{flex-basis:100%}.palF{display:flex;gap:6px;align-items:center;margin-bottom:6px}.aj .palF input{width:170px;font-family:var(--f-txt)}.palM{width:20px;height:20px;border-radius:50%;flex:none}
.listo{flex:1;background:var(--verde);color:#0d1a10;font:800 22px var(--f-disp);letter-spacing:1px;padding:12px}
.entregado{flex:1;background:var(--azul);color:#fff;font:800 20px var(--f-disp);letter-spacing:1px;padding:11px}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:18px}
.k{background:var(--ticket);border-radius:12px;padding:12px 16px}.k small{color:var(--sub);font-size:13px}
.k b{display:block;font:700 28px var(--f-num);margin-top:2px}
.grid2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));margin-bottom:18px}
.tbl{overflow-x:auto;background:var(--ticket);border-radius:12px;min-width:0}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--linea);white-space:nowrap}
th{color:var(--sub);font-weight:600}td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums}
td.prods{white-space:normal;color:var(--sub);min-width:220px}
.cv{color:var(--verde)}.ca{color:var(--ambar)}.cr{color:var(--rojo);font-weight:700}
h3{font:800 16px var(--f-disp);letter-spacing:1.4px;text-transform:uppercase;color:var(--sub);margin:0 0 8px}
#capa{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--bg) 94%,transparent);display:flex;align-items:center;justify-content:center;padding:24px}
.turno{background:var(--rail);border:1px solid var(--linea);border-radius:16px;padding:24px;width:min(100%,460px);display:flex;flex-direction:column;gap:14px}
.turno h2{font:800 32px/1 var(--f-disp);text-transform:uppercase;letter-spacing:.5px;margin:0}
.turno p{color:var(--sub);margin:0}
.turno input{background:var(--bg);border:1px solid var(--linea);color:var(--txt);border-radius:10px;padding:14px;font:600 22px var(--f-txt);width:100%}
.selT{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.selT button{background:var(--ticket);border:2px solid var(--linea);padding:12px 8px;font:800 22px var(--f-disp);text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:2px}
.selT button small{font:500 13px var(--f-num);color:var(--sub);text-transform:none}
.selT button.on{border-color:var(--cafe);background:color-mix(in srgb,var(--cafe) 25%,var(--ticket))}
.chip.enc.alerta{border-color:var(--ambar);background:color-mix(in srgb,var(--ambar) 22%,var(--bg))}
.filtroT{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.filtroT button{background:var(--ticket);border:1px solid var(--linea);padding:7px 14px;font-weight:600}
.filtroT button.on{background:var(--cafe);border-color:var(--cafe);color:#1a1410}
.aj select{background:var(--bg);border:1px solid var(--linea);color:var(--txt);border-radius:8px;padding:6px;font:600 15px var(--f-txt)}
.verde{background:var(--verde);color:#0d1a10;font:800 24px var(--f-disp);letter-spacing:1px;padding:15px}
.verde:disabled{opacity:.4;cursor:not-allowed}
.sec2{background:var(--ticket);border:1px solid var(--linea);font:700 18px var(--f-disp);letter-spacing:.6px;padding:12px;text-transform:uppercase}
.aj{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--ticket);border-radius:12px;padding:12px 14px;margin-bottom:18px}
.aj label{color:var(--sub);font-size:14px}.aj input{width:64px;background:var(--bg);border:1px solid var(--linea);color:var(--txt);border-radius:8px;padding:6px;font:600 16px var(--f-num)}
.aj .sub{color:var(--sub);font-size:13px;flex-basis:100%}.aj .sub b{color:var(--txt);font-family:var(--f-num)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--rojo);color:#fff;padding:10px 16px;border-radius:10px;z-index:30}
@media (max-width:600px){.marca{font-size:22px}.oc{display:none}}
@media (prefers-reduced-motion:reduce){.card.flash{animation:none}}
</style></head>
<body>
<div id="capa"><form class="turno" id="fTurno" autocomplete="off">
  <h2 id="capaT">Inicio de turno</h2>
  <p id="capaP">Escribe tu nombre para empezar. Las comandas que despaches quedarán a tu nombre.</p>
  <input id="inNombre" maxlength="24" placeholder="Tu nombre" aria-label="Tu nombre">
  <div class="selT" id="selT"><button type="button" data-t="AM">Turno AM<small>07:00 – 14:30</small></button><button type="button" data-t="PM">Turno PM<small>14:30 – 23:00</small></button></div>
  <button class="verde" id="btnEmpezar" type="submit" disabled>Empezar turno</button>
  <button class="sec2" id="btnSeguir" type="button" hidden></button>
</form></div>
<header><div class="wrap"><div class="barra">
  <div class="marca"><span id="conexion" title="Conexión con el servidor"></span><span class="logo"><b>MUHU</b><i>KDS</i></span></div>
  <nav><a href="#cocina" data-v="cocina">Cocina</a><a href="#caja" data-v="caja">Caja</a><a href="#tiempos" data-v="tiempos">Tiempos</a></nav>
  <span class="esp"></span>
  <button class="chip enc" id="btnTurno" title="Cambiar de encargado">👤 <b id="encNom">–</b> · <b id="encTurno">–</b> · desde <b id="encDesde">–</b> · <span id="encAcc">Cambiar turno</span></button>
  <span class="chip oc" title="Configura esta IP en Wally como impresora BIENEX E802">Wally → <b id="ipw">–</b></span>
  <span class="chip">Abiertas <b id="nAb">0</b></span>
  <span class="chip oc">Promedio hoy <b id="prom">–</b></span>
  <button class="b" id="btnRec" title="Devuelve a pantalla la última comanda marcada como lista">↩ Recuperar última</button>
  <button class="b oc" id="btnRecargar" title="Recargar pantalla">⟳</button>
</div></div></header>
<main class="wrap"><div id="vista"></div></main>
<script>
(()=>{
const MODO="__MODO__";
let est={comandas:[],ahora:Date.now()/1000,verde:6,ambar:10,encargado:null,turno_desde:null,hist:[]};
let desfase=0,ctx=null,vista=MODO,vistos=new Map(),flash=new Set(),listo=false;
const $=id=>document.getElementById(id), ahora=()=>Date.now()/1000+desfase;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mmss=seg=>{seg=Math.max(0,Math.floor(seg));return String(Math.floor(seg/60)).padStart(2,"0")+":"+String(seg%60).padStart(2,"0")};
const hhmm=t=>new Date(t*1000).toLocaleTimeString("es-PE",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
const semaf=m=>m<est.verde?"v":m<est.ambar?"a":"r", cls=m=>({v:"cv",a:"ca",r:"cr"})[semaf(m)];
function post(accion,extra){return fetch("/accion",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({accion,...extra})})}
function bip(t){if(window.Android&&vista==="cocina")return; /* en la tablet suena el sonido nativo */ if(!ctx)return;if(ctx.state==="suspended")ctx.resume();const N={nueva:[880,1175],listo:[660,880,1320],anulacion:[440,330,440],cambio:[988,988]}[t]||[700];
 let s=ctx.currentTime;for(const f of N){const o=ctx.createOscillator(),g=ctx.createGain();o.type="square";o.frequency.value=f;
 g.gain.setValueAtTime(.14,s);g.gain.exponentialRampToValueAtTime(.001,s+.2);o.connect(g).connect(ctx.destination);o.start(s);o.stop(s+.21);s+=.24}}
function audio(){if(ctx)return;try{ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
 try{navigator.wakeLock&&navigator.wakeLock.request("screen").catch(()=>{})}catch(e){}}

const COLORES={azul:"#4a8fe0",celeste:"#48c6e8",rojo:"#e2504a",verde:"#3fb36b",morado:"#a77de8",rosado:"#f07ab8",naranja:"#f08a3c",amarillo:"#f6cf62"};
const norm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
function colorDe(txt){const n=norm(txt);for(const r of est.palabras||[])if(r.p&&COLORES[r.c]&&n.includes(norm(r.p)))return COLORES[r.c];return null}
function tarjeta(c,modo){
 const t=ahora(),min=(t-c.recibida_ts)/60;
 const col=c.estado==="lista"?(modo==="caja"?"lista":"lista despachada"):semaf(min);
 const items=c.items.map((it,i)=>{
  const pc=colorDe(it.producto+" "+(it.mods||[]).join(" "));
  const k=(it.cancelado?"cancel":it.hecho?"hecho":"")+(pc?" pal":""),tap=modo==="cocina"&&c.estado==="abierta"&&!it.cancelado;
  const tag=it.cancelado?'<span class="tag anul">ANULADO</span>':it.marca==="cambio"?'<span class="tag cambio">CAMBIO</span>':it.marca==="nuevo"?'<span class="tag nuevo">NUEVO</span>':"";
  return `<li class="${k}${tap?" tap":""}"${pc?` style="--pc:${pc}"`:""} ${tap?`data-a="item" data-id="${c.id}" data-i="${i}" role="button" tabindex="0"`:""}><div class="p"><span class="q">${esc(it.cant)}×</span>${esc(it.producto)}${tag}</div>${(it.mods||[]).map(m=>`<div class="m">+ ${esc(m)}</div>`).join("")}</li>`}).join("");
 let acc="";
 if(modo==="cocina"&&c.estado==="abierta")acc=`<div class="acc"><button class="listo" data-a="listo" data-id="${c.id}">✓ LISTO</button></div>`;
 if(modo==="caja"&&c.estado==="lista")acc=`<div class="acc"><button class="entregado" data-a="entregado" data-id="${c.id}">ENTREGADO</button></div>`;
 const reloj=c.estado==="lista"?"LISTO "+mmss(c.lista_ts-c.recibida_ts):mmss(t-c.recibida_ts);
 const todo=norm([c.mesa,c.zona,c.titulo,...c.items.flatMap(i=>[i.producto,...(i.mods||[])])].join(" "));
 const llevar=todo.includes("llevar"),rappi=todo.includes("rappi");
 const bandas=(rappi?'<div class="banda rappi">🛵 RAPPI</div>':"")+(llevar?'<div class="banda llevar">🥡 PARA LLEVAR</div>':"");
 return `<div class="card ${col}${llevar?" llevar":""}${rappi?" rappi":""}${flash.has(c.id)?" flash":""}"><div class="top"><span class="mesa">${c.mesa?"Mesa "+esc(c.mesa):"Pedido #"+c.id}${c.zona?` <small>· ${esc(c.zona)}</small>`:""}</span><span class="reloj">${reloj}</span></div>${bandas}
 ${c.titulo?`<div class="titulo">📝 ${esc(c.titulo)}</div>`:""}<div class="meta">${esc(c.mozo||"")} · <b>${hhmm(c.recibida_ts)}</b></div><ul>${items}</ul>${acc}</div>`}

function vTablero(modo){
 const ab=est.comandas.filter(c=>c.estado==="abierta").sort((a,b)=>a.recibida_ts-b.recibida_ts);
 const li=est.comandas.filter(c=>c.estado==="lista").sort((a,b)=>b.lista_ts-a.lista_ts);
 let h="";
 if(modo==="caja"&&li.length)h+=`<div class="sec">🔔 Listo para entregar</div>${li.map(c=>tarjeta(c,modo)).join("")}<div class="sec">En preparación</div>`;
 h+=ab.length?ab.map(c=>tarjeta(c,modo)).join(""):`<div class="vacio">Sin comandas pendientes</div>`;
 if(modo==="cocina"&&li.length)h+=`<div class="sec">Despachadas recientes</div>${li.slice(0,4).map(c=>tarjeta(c,modo)).join("")}`;
 return `<div class="tablero ${modo}">${h}</div>`}

let histVista=[];
function agrupar(fn){const g=new Map();for(const h of histVista)for(const k of fn(h)){if(!g.has(k))g.set(k,[]);g.get(k).push(h.min)}
 return [...g].map(([k,v])=>[k,v.length,v.reduce((a,b)=>a+b,0)/v.length,Math.max(...v)]).sort((a,b)=>b[2]-a[2])}
function tabla(t,col,d){if(!d.length)return"";return `<div><h3>${t}</h3><div class="tbl"><table><tr><th>${col}</th><th>Veces</th><th>Promedio</th><th>Máximo</th></tr>
 ${d.map(([k,n,p,mx])=>`<tr><td>${esc(k)}</td><td class="n">${n}</td><td class="n ${cls(p)}">${mmss(p*60)}</td><td class="n">${mmss(mx*60)}</td></tr>`).join("")}</table></div></div>`}
let fT="Todos",turnoSel=null;
function horaAhora(){const d=new Date(Date.now()+desfase*1000);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
function turnoDeHora(h){return h<"14:30"?"AM":"PM"}
function turnoTermino(){if(!est.turno||!est.turnos||!est.turnos[est.turno])return false;const [ini,fin]=est.turnos[est.turno],h=horaAhora();return h<ini||h>=fin}
function vTiempos(){
 const filtro=`<div class="filtroT">${["Todos","AM","PM"].map(t=>`<button type="button" data-ft="${t}" class="${fT===t?"on":""}">${t==="Todos"?"Todo el día":"Turno "+t}</button>`).join("")}</div>`;
 const H=fT==="Todos"?est.hist:est.hist.filter(h=>(h.turno||turnoDeHora(hhmm(h.entro)))===fT),m=H.map(h=>h.min),p=m.length?m.reduce((a,b)=>a+b,0)/m.length:0;
 histVista=H;
 const kp=filtro+`<div class="kpis"><div class="k"><small>Despachadas ${fT==="Todos"?"hoy":"turno "+fT}</small><b>${m.length}</b></div>
  <div class="k"><small>Tiempo promedio</small><b class="${m.length?cls(p):""}">${m.length?mmss(p*60):"–"}</b></div>
  <div class="k"><small>Más rápida</small><b>${m.length?mmss(Math.min(...m)*60):"–"}</b></div>
  <div class="k"><small>Más lenta</small><b>${m.length?mmss(Math.max(...m)*60):"–"}</b></div>
  <div class="k"><small>Fuera de tiempo (≥${est.ambar} min)</small><b class="cr">${m.filter(x=>x>=est.ambar).length}</b></div></div>`;
 if(!H.length)return kp+ajustes()+`<div class="vacio">Aún no hay comandas despachadas ${fT==="Todos"?"hoy":"en el turno "+fT}.</div>`;
 const porT=fT!=="Todos"?"":(()=>{const ts=["AM","PM"].map(t=>[t,H.filter(h=>(h.turno||turnoDeHora(hhmm(h.entro)))===t)]).filter(x=>x[1].length);
  if(ts.length<2)return"";return `<h3>Por turno</h3><div class="tbl" style="margin-bottom:18px"><table><tr><th>Turno</th><th>Comandas</th><th>Promedio</th><th>Fuera de tiempo</th><th>Encargados</th></tr>${ts.map(([t,v])=>{const pm=v.reduce((a,x)=>a+x.min,0)/v.length;
  return `<tr><td><b>${t}</b></td><td class="n">${v.length}</td><td class="n ${cls(pm)}"><b>${mmss(pm*60)}</b></td><td class="n">${Math.round(v.filter(x=>x.min>=est.ambar).length*100/v.length)}%</td><td>${esc([...new Set(v.map(x=>x.enc).filter(Boolean))].join(", "))}</td></tr>`}).join("")}</table></div>`})();
 const g=new Map();for(const h of H){const k=h.enc||"Sin turno";if(!g.has(k))g.set(k,[]);g.get(k).push(h)}
 const enc=[...g].map(([k,v])=>{const mm=v.map(x=>x.min);return [k,v.length,v.reduce((s,x)=>s+x.prods.reduce((a,q)=>a+(parseFloat(q[0])||0),0),0),
  mm.reduce((a,b)=>a+b,0)/mm.length,mm.filter(x=>x>=est.ambar).length/mm.length]}).sort((a,b)=>a[3]-b[3]);
 const tEnc=`<h3>Por encargado (del más rápido al más lento)</h3><div class="tbl" style="margin-bottom:18px"><table><tr><th>Encargado</th><th>Comandas</th><th>Productos</th><th>Promedio</th><th>Fuera de tiempo</th></tr>
 ${enc.map(([k,n,pr,pm,f],i)=>`<tr><td>${i===0&&enc.length>1?"🏆 ":""}<b>${esc(k)}</b>${k===est.encargado?" <span style='color:var(--azul);font-weight:700;font-size:13px'>· en turno</span>":""}</td><td class="n">${n}</td><td class="n">${pr}</td><td class="n ${cls(pm)}"><b>${mmss(pm*60)}</b></td><td class="n ${f>0?"cr":""}">${Math.round(f*100)}%</td></tr>`).join("")}</table></div>`;
 const det=[...H].reverse().map(h=>`<tr><td class="n">#${h.id}</td><td class="n">${esc(h.mesa||"—")}</td><td>${esc(h.turno||"")}</td><td><b>${esc(h.enc||"—")}</b></td><td>${esc(h.mozo||"")}</td><td class="n">${hhmm(h.entro)}</td><td class="n">${hhmm(h.listo)}</td><td class="n ${cls(h.min)}"><b>${mmss(h.min*60)}</b></td><td class="prods">${h.prods.map(([c,q])=>esc(c)+" "+esc(q)).join(" · ")}</td></tr>`).join("");
 return kp+porT+tEnc+ajustes()+`<div class="grid2">${tabla("Por producto","Producto",agrupar(h=>h.prods.map(x=>x[1])))}${tabla("Por mozo","Mozo",agrupar(h=>[h.mozo||"—"]))}</div>
 <h3>Detalle por comanda</h3><div class="tbl"><table><tr><th>#</th><th>Mesa</th><th>Turno</th><th>Encargado</th><th>Mozo</th><th>Entró</th><th>Listo</th><th>Tiempo</th><th>Productos</th></tr>${det}</table></div>`}

let repF=null,repT="",sUrl="",sClave="";
function sheetsHtml(){const y=est.sync||{};
 const estado=!y.activo?"No conectado":y.error?`⚠️ ${esc(y.error)}`:`✅ Conectado${y.ultimo_ok?" · último envío "+hhmm(y.ultimo_ok).slice(0,5):""}`;
 return `<h3>Google Sheets (ver en línea)</h3><div class="aj"><span class="sub" style="flex-basis:100%">${estado} · ${y.pendientes||0} comanda(s) por enviar</span>
 <label style="flex:1 1 320px">URL de la aplicación web <input id="sUrl" value="${esc(sUrl)}" placeholder="https://script.google.com/macros/s/.../exec" style="width:100%"></label>
 <label>Clave <input id="sClave" value="${esc(sClave)}" style="width:200px"></label>
 <button class="b" id="btnSync">Guardar y conectar</button>${y.activo?'<button class="b" id="btnSyncYa">Enviar ahora</button>':""}
 <span class="sub">Al conectar se sube también el historial guardado en la tablet. Si se cae el internet, las comandas esperan y se envían solas al volver.</span></div>`}
function hoyLocal(){const d=new Date(Date.now()+desfase*1000);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
let palEd=null;const palE=()=>palEd||(palEd=JSON.parse(JSON.stringify(est.palabras||[])));
function palHtml(){const L=palEd||est.palabras||[];
 return `<h3>Palabras de color</h3><div class="aj"><div id="palL">${L.map((r,i)=>`<div class="palF"><input data-pi="${i}" value="${esc(r.p)}" placeholder="palabra"><select data-pc="${i}">${Object.keys(COLORES).map(k=>`<option ${r.c===k?"selected":""}>${k}</option>`).join("")}</select><span class="palM" style="background:${COLORES[r.c]||"#888"}"></span><button class="b" data-pdel="${i}">✕</button></div>`).join("")}</div>
 <button class="b" id="palAdd">＋ Agregar palabra</button><button class="b" id="palOk">Guardar palabras</button>
 <span class="sub">Si el producto o su nota contiene la palabra, se pinta de ese color en cocina. No importan mayúsculas ni tildes: "frapp" sirve para frappé y frappuccino. <b>Para llevar</b> y <b>Rappi</b> se detectan solos.</span></div>`}
function ajustes(){const and=!!window.Android;if(!repF)repF=hoyLocal();
 return `<h3>Reporte del servicio</h3><div class="aj"><label>Fecha <input id="repF" type="date" value="${repF}" style="width:auto"></label>
 <label>Turno <select id="repT">${[["","Todo el día"],["AM","Turno AM"],["PM","Turno PM"]].map(([v,t])=>`<option value="${v}" ${repT===v?"selected":""}>${t}</option>`).join("")}</select></label>
 <button class="b" id="btnRep">📄 ${and?"Compartir reporte PDF":"Descargar reporte PDF"}</button>
 <span class="sub">Comandas, tiempo de cada una, promedio, producto que más demoró y resultado por encargado. Listo para enviar al grupo de cocina.</span></div>
 ${and?sheetsHtml():""}
 ${palHtml()}
 ${and?`<h3>Sonido de pedidos</h3><div class="aj"><div class="filtroT">${["Normal","Fuerte","Máximo"].map((t,i)=>`<button data-vol="${i}" class="${Android.volumen()===i?"on":""}">${t}</button>`).join("")}</div>
 <button class="b" id="btnSon">🔊 Probar sonido</button>
 <span class="sub">Suena por el canal de alarma y sube el volumen sola en cada pedido. Máximo repite el aviso 3 veces.</span></div>`:""}
 <h3>Ajustes</h3><div class="aj"><label>Verde hasta <input id="semV" type="number" min="1" max="60" value="${est.verde}"> min</label>
 <label>Rojo desde <input id="semA" type="number" min="2" max="120" value="${est.ambar}"> min</label>
 <button class="b" id="btnSem">Guardar semáforo</button>
 <span class="sub">IP para Wally: <b>${esc(est.ip||"–")}</b> · puerto 9100 · modelo BIENEX E802</span>
 ${and?`<button class="b" id="btnInicio">Usar KDS como pantalla de inicio</button><button class="b" id="btnAjAnd">Ajustes de la tablet</button>`:""}</div>`}
function pintar(){
 const foco=document.activeElement;
 if(vista==="tiempos"&&foco&&foco.tagName==="INPUT"&&$("vista").contains(foco))return; // no borrar lo que se está escribiendo
 $("vista").innerHTML=vista==="tiempos"?vTiempos():vTablero(vista);flash.clear();
 $("nAb").textContent=est.comandas.filter(c=>c.estado==="abierta").length;
 const m=est.hist.map(h=>h.min);$("prom").textContent=m.length?mmss(m.reduce((a,b)=>a+b,0)/m.length*60):"–";
 $("encNom").textContent=est.encargado||"Sin encargado";$("encDesde").textContent=est.turno_desde?hhmm(est.turno_desde).slice(0,5):"–";
 $("encTurno").textContent=est.turno?"Turno "+est.turno:"Sin turno";
 const fin=turnoTermino();$("btnTurno").classList.toggle("alerta",fin);
 $("encAcc").textContent=fin?"Turno "+est.turno+" terminó · Cambiar":"Cambiar turno";
 $("btnRec").hidden=vista!=="cocina";$("ipw").textContent=est.ip||"–";
 document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.v===vista))}

// ---- capa de inicio: turno en cocina, activar sonido en caja
function abrirCapa(){
 const enCocina=vista==="cocina";
 $("capaT").textContent=enCocina?"Inicio de turno":"Pantalla de caja";
 $("capaP").textContent=enCocina?"Escribe tu nombre para empezar. Las comandas que despaches quedarán a tu nombre.":"Activa la pantalla para escuchar el aviso cuando un pedido esté listo.";
 $("inNombre").hidden=!enCocina;$("inNombre").value="";$("selT").hidden=!enCocina;
 turnoSel=turnoDeHora(horaAhora());marcarTurno();
 $("btnEmpezar").textContent=enCocina?"Empezar turno":"Activar pantalla";$("btnEmpezar").disabled=enCocina;
 if(enCocina)marcarTurno();
 const sig=$("btnSeguir");sig.hidden=!(enCocina&&est.encargado&&!turnoTermino());if(est.encargado)sig.textContent="Continuar como "+est.encargado+(est.turno?" · Turno "+est.turno:"");
 $("capa").hidden=false;if(enCocina)setTimeout(()=>$("inNombre").focus(),50)}
function marcarTurno(){document.querySelectorAll("#selT button").forEach(b=>b.classList.toggle("on",b.dataset.t===turnoSel));
 if(vista==="cocina")$("btnEmpezar").textContent="Empezar turno "+(turnoSel||"")}
$("selT").onclick=e=>{const b=e.target.closest("button");if(!b)return;turnoSel=b.dataset.t;marcarTurno()};
$("inNombre").oninput=()=>{$("btnEmpezar").disabled=!$("inNombre").value.trim()};
$("fTurno").onsubmit=e=>{e.preventDefault();audio();
 if(vista==="cocina"){const n=$("inNombre").value.trim();if(!n)return;post("turno",{nombre:n,turno:turnoSel||turnoDeHora(horaAhora())})}
 $("capa").hidden=true};
$("btnSeguir").onclick=()=>{audio();$("capa").hidden=true};
$("btnTurno").onclick=()=>{vista="cocina";location.hash="cocina";pintar();abrirCapa()};
$("btnRec").onclick=()=>post("recuperar");

$("btnRecargar").onclick=()=>location.reload();
$("vista").addEventListener("change",e=>{if(e.target.dataset.pc!==undefined){palE()[+e.target.dataset.pc].c=e.target.value;pintar()}
 if(e.target.id==="repF")repF=e.target.value;if(e.target.id==="repT")repT=e.target.value});
$("vista").addEventListener("input",e=>{if(e.target.dataset.pi!==undefined)palE()[+e.target.dataset.pi].p=e.target.value;
 if(e.target.id==="sUrl")sUrl=e.target.value;if(e.target.id==="sClave")sClave=e.target.value});
$("vista").addEventListener("click",e=>{const t=e.target;
 if(t.id==="btnSem"){post("config",{verde:+$("semV").value,ambar:+$("semA").value}).then(r=>{if(!r.ok)alertar("El rojo debe ser mayor que el verde")})}
 if(t.id==="btnInicio"&&window.Android)Android.elegirInicio();
 if(t.id==="palAdd"){palE().push({p:"",c:"azul"});pintar()}
 if(t.dataset&&t.dataset.pdel!==undefined){palE().splice(+t.dataset.pdel,1);pintar()}
 if(t.id==="palOk"){const L=palE().filter(r=>r.p.trim());post("palabras",{url:JSON.stringify(L)}).then(r=>{if(r.ok){palEd=null;alertar("Palabras guardadas")}else alertar("No se pudo guardar")})}
 if(t.id==="btnSon"&&window.Android)Android.probarSonido();
 if(t.dataset&&t.dataset.vol!==undefined&&window.Android){Android.ponerVolumen(+t.dataset.vol);document.querySelectorAll("[data-vol]").forEach(b=>b.classList.toggle("on",b===t))}
 if(t.id==="btnSync"){post("sync_config",{url:sUrl.trim(),clave:sClave.trim()}).then(r=>{if(!r.ok)alertar("La URL debe empezar con https://script.google.com/")})}
 if(t.id==="btnSyncYa")post("sync_ahora",{});
 if(t.id==="btnRep"){repF=$("repF").value||hoyLocal();if(window.Android)Android.reportePdf(repF,repT);else location.href="/reporte.pdf?fecha="+repF+(repT?"&turno="+repT:"")}
 if(t.dataset&&t.dataset.ft){fT=t.dataset.ft;pintar()}
 if(t.id==="btnAjAnd"&&window.Android)Android.abrirAjustes()});
function alertar(m){const d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),3000)}

$("vista").addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(!el)return;
 if(el.dataset.a==="listo"&&!est.encargado){abrirCapa();return}
 post(el.dataset.a,{id:+el.dataset.id,idx:el.dataset.i!==undefined?+el.dataset.i:null})});
$("vista").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){const el=e.target.closest("li[data-a]");if(el){e.preventDefault();el.click()}}});

function ruta(){const h=location.hash.slice(1);if(["cocina","caja","tiempos"].includes(h))vista=h;pintar()}
addEventListener("hashchange",ruta);

function conectar(){const es=new EventSource("/eventos");
 es.onopen=()=>$("conexion").classList.add("ok");
 es.onerror=()=>$("conexion").classList.remove("ok");
 es.onmessage=e=>{const d=JSON.parse(e.data);est=d;desfase=d.ahora-Date.now()/1000;
  for(const c of d.comandas){const v=vistos.get(c.id);if(listo&&v!==c.actualizada_ts)flash.add(c.id);vistos.set(c.id,c.actualizada_ts)}
  const primera=!listo;listo=true;pintar();
  if(primera){
   // El turno se mantiene hasta que alguien toque "Cambiar turno". En la app no se vuelve a pedir el nombre.
   if(vista==="tiempos"||(window.Android&&(vista!=="cocina"||est.encargado))){$("capa").hidden=true;audio()}
   else abrirCapa();
   return}
  const suena=vista==="cocina"?["nueva","cambio","anulacion"]:vista==="caja"?["listo","anulacion"]:[];
  if(suena.includes(d.evento))bip(d.evento)}}
ruta();conectar();setInterval(()=>{if(vista!=="tiempos")pintar()},1000);
})();
</script></body></html>
