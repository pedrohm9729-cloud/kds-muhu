name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
      - name: Compilar
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk KDS-Muhu.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KDS-Muhu-apk
          path: KDS-Muhu.apk
      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: KDS Muhu v1.0.${{ github.run_number }}
          body: "Descarga KDS-Muhu.apk e instálalo en la tablet."
          files: KDS-Muhu.apk
